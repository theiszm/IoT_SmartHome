services:
  backend-api:
    build:
      context: ./IoT_SmartHome.Api
      dockerfile: Dockerfile
    ports:
      - "5279:5279"
    volumes:
      - ./IoT_SmartHome.Api:/app
      - /app/obj/
      - /app/bin/
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5279

  frontend-client:
    build:
      context: ./IoT_SmartHome.Client
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./IoT_SmartHome.Client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend-api